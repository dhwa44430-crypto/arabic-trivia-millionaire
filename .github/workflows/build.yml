
name: Build APK & App Bundle

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125'
          accept-android-sdk-licenses: true

      - name: Reinstall Android SDK 35
        run: |
          yes | sdkmanager --uninstall "platforms;android-35" || true
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Create Clean Flutter Project & Copy Files
        run: |
          flutter create temp_app --org com.arabictrivia --project-name arabic_trivia_millionaire

          python3 - <<'PY'
          from pathlib import Path
          import re

          # إعداد AndroidManifest وإضافة معرف AdMob
          manifest = Path("temp_app/android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text()

              if "com.google.android.gms.ads.APPLICATION_ID" not in text:
                  text = text.replace(
                      "</application>",
                      '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>'
                  )

              manifest.write_text(text)

          # ضبط إعدادات تطبيق Android
          app_gradle = Path("temp_app/android/app/build.gradle")
          if not app_gradle.exists():
              app_gradle = Path("temp_app/android/app/build.gradle.kts")

          if app_gradle.exists():
              content = app_gradle.read_text()
              is_kts = app_gradle.suffix == ".kts"

              content = re.sub(
                  r'(?m)^([ \t]*compileSdk(?:Version)?[ \t]*(?:=[ \t]*)?).+$',
                  r'\g<1>35',
                  content
              )

              content = re.sub(
                  r'(?m)^([ \t]*minSdk(?:Version)?[ \t]*(?:=[ \t]*)?).+$',
                  r'\g<1>21',
                  content
              )

              content = re.sub(
                  r'(?m)^([ \t]*targetSdk(?:Version)?[ \t]*(?:=[ \t]*)?).+$',
                  r'\g<1>35',
                  content
              )

              # ضبط إصدار NDK
              ndk_value = 'ndkVersion = "26.1.10909125"' if is_kts else 'ndkVersion "26.1.10909125"'

              if re.search(r'(?m)^[ \t]*ndkVersion\b', content):
                  content = re.sub(
                      r'(?m)^([ \t]*)ndkVersion\b.*$',
                      lambda m: m.group(1) + ndk_value,
                      content
                  )
              else:
                  content = re.sub(
                      r'(?m)^([ \t]*android[ \t]*\{)',
                      lambda m: m.group(1) + '\n    ' + ndk_value,
                      content,
                      count=1
                  )

              # توحيد إعدادات Java على الإصدار 17
              compile_options = re.search(
                  r'(?ms)^([ \t]*compileOptions[ \t]*\{)(.*?)(^[ \t]*\})',
                  content
              )

              if compile_options:
                  block = compile_options.group(2)

                  java_source = 'sourceCompatibility = JavaVersion.VERSION_17' if is_kts else 'sourceCompatibility JavaVersion.VERSION_17'
                  java_target = 'targetCompatibility = JavaVersion.VERSION_17' if is_kts else 'targetCompatibility JavaVersion.VERSION_17'

                  if re.search(r'(?m)^[ \t]*sourceCompatibility\b.*$', block):
                      block = re.sub(
                          r'(?m)^([ \t]*)sourceCompatibility\b.*$',
                          lambda m: m.group(1) + java_source,
                          block
                      )
                  else:
                      block += '\n        ' + java_source

                  if re.search(r'(?m)^[ \t]*targetCompatibility\b.*$', block):
                      block = re.sub(
                          r'(?m)^([ \t]*)targetCompatibility\b.*$',
                          lambda m: m.group(1) + java_target,
                          block
                      )
                  else:
                      block += '\n        ' + java_target

                  content = content[:compile_options.start(2)] + block + content[compile_options.end(2):]
              else:
                  content = re.sub(
                      r'(?m)^([ \t]*android[ \t]*\{)',
                      lambda m: m.group(1) + '\n    compileOptions {\n        ' +
                                ('sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17' if is_kts else 'sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17') +
                                '\n    }',
                      content,
                      count=1
                  )

              # توحيد إعدادات Kotlin على الإصدار 17
              kotlin_options = re.search(
                  r'(?ms)^([ \t]*kotlinOptions[ \t]*\{)(.*?)(^[ \t]*\})',
                  content
              )

              if kotlin_options:
                  block = kotlin_options.group(2)

                  if re.search(r'(?m)^[ \t]*jvmTarget\b.*$', block):
                      block = re.sub(
                          r'(?m)^([ \t]*)jvmTarget\b.*$',
                          lambda m: m.group(1) + 'jvmTarget = "17"',
                          block
                      )
                  else:
                      block += '\n        jvmTarget = "17"'

                  content = content[:kotlin_options.start(2)] + block + content[kotlin_options.end(2):]
              else:
                  content = re.sub(
                      r'(?m)^([ \t]*android[ \t]*\{)',
                      lambda m: m.group(1) + '\n    kotlinOptions {\n        jvmTarget = "17"\n    }',
                      content,
                      count=1
                  )

              app_gradle.write_text(content)

          # ضبط إصدارات Android Gradle Plugin و Kotlin
          settings_gradle = Path("temp_app/android/settings.gradle")
          if not settings_gradle.exists():
              settings_gradle = Path("temp_app/android/settings.gradle.kts")

          if settings_gradle.exists():
              content = settings_gradle.read_text()

              content = re.sub(
                  r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+(["\'])',
                  r'\g<1>8.6.1\2',
                  content
              )

              content = re.sub(
                  r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])',
                  r'\g<1>1.9.24\2',
                  content
              )

              settings_gradle.write_text(content)

          # ضبط إصدار Gradle Wrapper
          wrapper = Path("temp_app/android/gradle/wrapper/gradle-wrapper.properties")

          if wrapper.exists():
              content = wrapper.read_text()

              content = re.sub(
                  r'distributionUrl=.*',
                  'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip',
                  content
              )

              wrapper.write_text(content)
          PY

          # نسخ ملفات التطبيق الأصلية
          rm -rf temp_app/lib/*
          cp -r lib/. temp_app/lib/

          # نسخ ملفات pubspec
          cp pubspec.yaml temp_app/

          # نسخ مجلد الأصول إذا كان موجوداً
          if [ -d assets ]; then
            cp -r assets temp_app/
          fi

          # ضمان وجود مسار الأصوات المشار إليه في pubspec.yaml
          mkdir -p temp_app/assets/sounds

          cd temp_app
          flutter pub get

      - name: Build APK & App Bundle
        run: |
          cd temp_app
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: temp_app/build/app/outputs/bundle/release/app-release.aab
