name: Build APK & App Bundle

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android SDK 35
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Create Clean Flutter Project & Copy Files
        run: |
          flutter create temp_app --org com.arabictrivia --project-name arabic_trivia_millionaire

          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("temp_app/android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace(
                  "</application>",
                  '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>'
              )
          manifest.write_text(text)
          PY

          rm -rf temp_app/lib/*
          cp -r lib/* temp_app/lib/
          cp pubspec.yaml temp_app/

          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' temp_app/android/app/build.gradle || true

          if ! grep -q "minSdkVersion 21" temp_app/android/app/build.gradle; then
            sed -i '/defaultConfig {/a \        minSdkVersion 21' temp_app/android/app/build.gradle
          fi

          sed -i 's/compileSdk.*/compileSdk 35/g' temp_app/android/app/build.gradle || true
          sed -i 's/targetSdk.*/targetSdk 35/g' temp_app/android/app/build.gradle || true
          sed -i 's/compileSdkVersion.*/compileSdkVersion 35/g' temp_app/android/app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 35/g' temp_app/android/app/build.gradle || true

          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.24'/g" temp_app/android/build.gradle || true

          if ! grep -q "ext.kotlin_version" temp_app/android/build.gradle; then
            sed -i "1i buildscript { ext.kotlin_version = '1.9.24' }" temp_app/android/build.gradle
          fi

          sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '1.9.24'/g" temp_app/android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' temp_app/android/settings.gradle

          cd temp_app
          flutter pub get

      - name: Build APK & App Bundle
        run: |
          cd temp_app
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: temp_app/build/app/outputs/bundle/release/app-release.aab
