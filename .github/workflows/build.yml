name: Build APK & App Bundle

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Create Clean Flutter Project & Copy Files
        run: |
          flutter create temp_app --org com.arabictrivia --project-name arabic_trivia_millionaire
          rm -rf temp_app/lib/*
          cp -r lib/* temp_app/lib/
          cp pubspec.yaml temp_app/
          cd temp_app
          flutter pub get

      - name: Build APK & App Bundle
        run: |
          cd temp_app
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: temp_app/build/app/outputs/bundle/release/app-release.aab
